<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ユーザー詳細</title>
  </head>
  <body>
    <header>
      <h1>ユーザー詳細</h1>
    </header>

    <main>
      <div>
        <p><span>ID : </span><span th:text="${user.id}"></span></p>
        <p><span>名前 : </span><span th:text="${user.name}"></span></p>
        <p><span>年齢 : </span><span th:text="${user.age}"></span></p>
        <p>
          <span>メールアドレス : </span><span th:text="${user.email}"></span>
        </p>
      </div>
      <br />
      <p><a th:href="@{/mini/users}">ユーザー一覧へ戻る</a></p>
    </main>
  </body>
</html>
